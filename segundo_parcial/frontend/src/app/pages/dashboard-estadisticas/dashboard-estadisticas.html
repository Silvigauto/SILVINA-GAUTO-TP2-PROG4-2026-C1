<div class="contenedor-estadisticas">
  <div class="card filtro-fechas">
    <label>Desde:</label>
    <input type="date" [(ngModel)]="desde"/>
    <label>Hasta:</label>
    <input type="date" [(ngModel)]="hasta"/>
    <button class="btn-primario" (click)="cargarEstadisticas()">Filtrar</button>
  </div>

  <div class="graficos">
    <div class="card grafico">
      <h3 class="titulo-seccion">Publicaciones por usuario</h3>
      <canvas id="graficoPublicaciones"></canvas>
    </div>

    <div class="card grafico">
      <h3 class="titulo-seccion">Comentarios por día</h3>
      <canvas id="graficoComentariosTiempo"></canvas>
    </div>

    <div class="card grafico">
      <h3 class="titulo-seccion">Comentarios por publicación</h3>
      <canvas id="graficoComentariosPublicacion"></canvas>
    </div>
  </div>
</div>
