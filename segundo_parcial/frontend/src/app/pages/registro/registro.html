<div class="contenedor-registro">
  <h2>Registrarse</h2>

  <form [formGroup]="formularioRegistro" (ngSubmit)="alEnviar()">

    <div class="grupo-campo">
      <label>Nombre</label>
      <input type="text" formControlName="nombre" placeholder="Nombre"/>
      <span *ngIf="formularioRegistro.get('nombre')?.invalid && formularioRegistro.get('nombre')?.touched">
        El nombre es requerido
      </span>
    </div>

    <div class="grupo-campo">
      <label>Apellido</label>
      <input type="text" formControlName="apellido" placeholder="Apellido"/>
      <span *ngIf="formularioRegistro.get('apellido')?.invalid && formularioRegistro.get('apellido')?.touched">
        El apellido es requerido
      </span>
    </div>

    <div class="grupo-campo">
      <label>Correo</label>
      <input type="email" formControlName="email" placeholder="Correo"/>
      <span *ngIf="formularioRegistro.get('email')?.invalid && formularioRegistro.get('email')?.touched">
        El correo no es válido
      </span>
    </div>

    <div class="grupo-campo">
      <label>Nombre de usuario</label>
      <input type="text" formControlName="username" placeholder="Nombre de usuario"/>
      <span *ngIf="formularioRegistro.get('username')?.invalid && formularioRegistro.get('username')?.touched">
        El nombre de usuario es requerido
      </span>
    </div>

    <div class="grupo-campo">
      <label>Contraseña</label>
      <input type="password" formControlName="contraseña" placeholder="Contraseña"/>
      <span *ngIf="formularioRegistro.get('contraseña')?.invalid && formularioRegistro.get('contraseña')?.touched">
        La contraseña debe tener al menos 8 caracteres, una mayúscula y un número
      </span>
    </div>

    <div class="grupo-campo">
      <label>Repetir contraseña</label>
      <input type="password" formControlName="repetirContraseña" placeholder="Repetir contraseña"/>
    </div>

    <div class="grupo-campo">
      <label>Fecha de nacimiento</label>
      <input type="date" formControlName="fechaNacimiento"/>
    </div>

    <div class="grupo-campo">
      <label>Descripción</label>
      <textarea formControlName="descripcion" placeholder="Descripción breve"></textarea>
    </div>

    <div class="grupo-campo">
      <label>Foto de perfil</label>
      <input type="file" accept="image/*" (change)="alSeleccionarImagen($event)"/>
    </div>

    <button type="submit" [disabled]="formularioRegistro.invalid">Registrarse</button>

  </form>

  <p>¿Ya tenés cuenta? <a (click)="irALogin()">Iniciá sesión</a></p>
</div>
