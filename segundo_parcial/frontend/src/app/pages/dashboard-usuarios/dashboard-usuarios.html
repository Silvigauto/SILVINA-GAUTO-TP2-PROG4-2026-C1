<div class="contenedor-dashboard">
  <button class="btn-primario" (click)="mostrarFormulario = !mostrarFormulario">
    {{ mostrarFormulario ? 'Cancelar' : 'Nuevo usuario' }}
  </button>

  @if (mostrarFormulario) {
    <div class="card formulario-usuario">
      <h3 class="titulo-seccion">Nuevo usuario</h3>
      <input type="text" [(ngModel)]="nuevoUsuario.nombre" placeholder="Nombre"/>
      <input type="text" [(ngModel)]="nuevoUsuario.apellido" placeholder="Apellido"/>
      <input type="email" [(ngModel)]="nuevoUsuario.email" placeholder="Correo"/>
      <input type="text" [(ngModel)]="nuevoUsuario.username" placeholder="Nombre de usuario"/>
      <input type="password" [(ngModel)]="nuevoUsuario.contrasena" placeholder="Contraseña"/>
      <input type="date" [(ngModel)]="nuevoUsuario.fechaNacimiento"/>
      <textarea [(ngModel)]="nuevoUsuario.descripcion" placeholder="Descripción"></textarea>
      <div class="grupo-campo">
  <label>Rol</label>
  <div class="radio-grupo">
    <label>
      <input type="radio" [(ngModel)]="nuevoUsuario.rol" value="usuario"/>
      Usuario
    </label>
    <label>
      <input type="radio" [(ngModel)]="nuevoUsuario.rol" value="administrador"/>
      Administrador
    </label>
  </div>
</div>
      <button class="btn-primario" (click)="crearUsuario()">Crear</button>
    </div>
  }

  <div class="lista-usuarios">
    @for (usuario of listadoUsuarios; track usuario._id) {
      <div class="card usuario" [class.deshabilitado]="!usuario.activo">
        <div class="usuario-info">
          <strong>{{ usuario.nombre }} {{ usuario.apellido }}</strong>
          <span class="texto-secundario">{{ usuario.email }}</span>
          <span class="texto-secundario">{{ usuario.rol }}</span>
          <span class="texto-secundario">{{ usuario.activo ? 'Activo' : 'Deshabilitado' }}</span>
        </div>
        <div class="usuario-acciones">
          @if (usuario.activo) {
            <button class="btn-peligro" (click)="deshabilitar(usuario._id)">Deshabilitar</button>
          } @else {
            <button class="btn-primario" (click)="habilitar(usuario._id)">Habilitar</button>
          }
        </div>
      </div>
    }
  </div>
</div>
